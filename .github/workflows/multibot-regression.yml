name: Multi-bot regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
      - name: Install project and development dependencies
        run: uv sync --frozen
      - name: Compile runtime and tests
        run: uv run --no-sync python -m compileall -q app tests
      - name: Run regression suite
        env:
          PYTHONPATH: .
        run: |
          set +e
          uv run --no-sync pytest -vv tests/test_multi_bot_runtime_isolation.py tests/test_central_registration_isolation.py tests/test_representative_provisioning.py > test-results.txt 2>&1
          status=$?
          cat test-results.txt
          exit $status
      - name: Upload regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-bot-regression-output
          path: test-results.txt
          if-no-files-found: error
