name: Multi-bot regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456:TEST_TOKEN_FOR_CI_ONLY"
      ADMIN_ID: "1"
      SQLALCHEMY_DATABASE_URL: "sqlite+aiosqlite:///./ci-test.db"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
      - name: Install project and development dependencies
        run: uv sync --frozen
      - name: Compile runtime and tests
        run: uv run --no-sync python -m compileall -q app tests
      - name: Test runtime context isolation
        env:
          PYTHONPATH: .
        run: uv run --no-sync pytest -q tests/test_multi_bot_runtime_isolation.py
      - name: Test central registration isolation
        env:
          PYTHONPATH: .
        run: uv run --no-sync pytest -q tests/test_central_registration_isolation.py
      - name: Test tenant provisioning and multi-registration
        env:
          PYTHONPATH: .
        run: uv run --no-sync pytest -q tests/test_representative_provisioning.py
