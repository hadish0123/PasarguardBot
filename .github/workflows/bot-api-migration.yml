name: Bot API migration checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compile Python files
        run: python -m compileall -q app telethon
      - name: Verify forbidden Telegram credentials are absent from runtime config
        run: |
          ! grep -R --line-number --exclude-dir=.git --exclude=uv.lock -E '^[[:space:]]*(API_ID|API_HASH|TELETHON_SESSION_PATH)[[:space:]]*=' config.py .env.example
      - name: Resolve dependencies
        run: uv lock
